<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Login - Miniaturas de Luxo</title>

</head>
<body>
    <header>
        <h1>Miniaturas de Carros de Luxo</h1>
    </header>

    <main class="container">
        <form id="loginForm">
            <h2>Login</h2>
            <input type="email" id="loginEmail" name="email" placeholder="Email" required>
            <input type="password" id="loginPassword" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
            <a href="cadastro.html" class="link">Não tem conta? Cadastre-se</a>
        </form>
        <div id="result"></div>
    </main>
