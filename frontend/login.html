<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Miniaturas de Luxo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Miniaturas de Carros de Luxo</h1>
    </header>

    <main class="container">
        <form action="/login" method="POST">
            <h2>Login</h2>

            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
            <a href="/cadastro_page" class="link">Não tem conta? Cadastre-se</a>
        </form>
    </main>

    <footer>
        &copy; 2025 Miniaturas de Luxo. Todos os direitos reservados.
    </footer>
</body>
</html>
