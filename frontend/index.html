<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Miniaturas de Luxo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Miniaturas de Carros de Luxo</h1>
    </header>

    <main class="container">
        <p class="subtitle">Para colecionadores exigentes</p>
        <div class="buttons">
            <button onclick="window.location.href='/login_page'">Login</button>
            <button onclick="window.location.href='/cadastro_page'">Cadastro</button>
        </div>

        <h2 class="section-title">Nossas Miniaturas</h2>
        <div class="cards">
            <div class="card">
                <img src="images/car1.jpg" alt="Miniatura 1">
                <p>Ferrari F8 - Escala 1:18</p>
            </div>
            <div class="card">
                <img src="images/car2.jpg" alt="Miniatura 2">
                <p>Lamborghini Aventador - Escala 1:18</p>
            </div>
            <div class="card">
                <img src="images/car3.jpg" alt="Miniatura 3">
                <p>Porsche 911 Turbo - Escala 1:18</p>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2025 Miniaturas de Luxo. Todos os direitos reservados.
    </footer>
</body>
</html>
