<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Miniaturas de Luxo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Miniaturas de Carros de Luxo</h1>
    </header>

    <main class="container">
        <form id="registerForm">
            <h2>Cadastro</h2>
            <input type="text" id="name" name="name" placeholder="Nome" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="password" id="password" name="password" placeholder="Senha" required>
            <input type="text" id="cnpj" name="cnpj" placeholder="CNPJ" required>
            <input type="text" id="celular" name="celular" placeholder="Celular" required>
            <button type="submit">Cadastrar</button>
        </form>
        <div id="result"></div>
    </main>

    <footer>
        &copy; 2025 Miniaturas de Luxo. Todos os direitos reservados.
    </footer>
    <script src="javascript/script.js"></script>
</body>
</html>
